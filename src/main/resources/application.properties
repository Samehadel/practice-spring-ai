# Application
spring.application.name=spring-ai

# Logging
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# OpenAI
spring.ai.openai.api-key=${openai.api-key}
spring.ai.openai.chat.options.model=gpt-3.5-turbo

# Ollama
#spring.ai.model.chat=ollama # This one disrupt the bean creation of OpenAIChatClient
spring.ai.ollama.chat.options.model=llama3.2:1b
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.ai.practice.random-data-initializer.enabled=false

# NVIDIA
spring.ai.nvidia.api-key=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

# Docker Compose
spring.docker.compose.stop.command=down

# Qdrant Vector Store
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=ai-practice
spring.ai.vectorstore.qdrant.initialize-schema=true

# Chat Memory
spring.ai.chat.client.enabled=false
spring.ai.chat.memory.max.messages=7

# Chat Memory JDBC Repository
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:schema/schema-h2.sql

# Datasource
spring.datasource.url=jdbc:h2:file:~/Sameh/all-practice/ai/practice-spring-ai/chatmemory;AUTO_SERVER=true
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=12345

# JPA
spring.jpa.show-sql=true